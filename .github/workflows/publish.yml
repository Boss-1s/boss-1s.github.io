name: pages build and deploy (neo)

on:
  push:
    branches:
      - from-the-beginning,-again
  workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          pages: write
          id-token: write
        steps:
        - uses: actions/checkout@v7
        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: 3.4.9
            bundler-cache: true
        - name: Install dependencies
          run: |
            cd boss-1s.github.io || exit 1
            bundle install
        - name: Build site with Jekyll
          run: |
            cd boss-1s.github.io || exit 1
            bundle exec jekyll build
        - name: Deploy to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4.1.0
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./boss-1s.github.io/_site
